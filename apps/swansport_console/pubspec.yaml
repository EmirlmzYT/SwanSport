name: swansport_console
description: SwanSport masaüstü yönetim konsolu (web).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # usePathUrlStrategy — adres çubuğunda `/#/` yerine gerçek yol.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  swansport_core: ^0.1.0
  swansport_data: ^0.1.0
  swansport_design_system: ^0.1.0
  # CSV indirme (Blob + geçici bağlantı).
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
