name: Build iOS IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/swansport_app/**'
      - 'packages/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: apps/swansport_app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_ENV=production

      - name: Package IPA for Sideloadly
        working-directory: apps/swansport_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r swansport.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swansport-ios-ipa
          path: apps/swansport_app/build/ios/iphoneos/swansport.ipa
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ github.run_number }}
          name: SwanSport iOS v${{ github.run_number }}
          body: |
            İmzalanmamış iOS IPA. Sideloadly ile test cihazına yüklenebilir.
            App Store/TestFlight dağıtımı için Apple signing sertifikaları gerekir.
          files: apps/swansport_app/build/ios/iphoneos/swansport.ipa
          fail_on_unmatched_files: true
