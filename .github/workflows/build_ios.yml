name: Release iOS to TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      IOS_BUNDLE_ID: com.swansport.app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Validate tag version
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(sed -n 's/^version: //p' apps/swansport_app/pubspec.yaml)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag v${VERSION} bekleniyordu; gelen etiket: ${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ env.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Configure release signing
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          test -n "$IOS_TEAM_ID" || { echo 'IOS_TEAM_ID repository variable eksik' >&2; exit 1; }
          cat > apps/swansport_app/ios/Flutter/Signing.xcconfig <<EOF
          DEVELOPMENT_TEAM = $IOS_TEAM_ID
          CODE_SIGN_STYLE = Automatic
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF
      - name: Build signed IPA
        working-directory: apps/swansport_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL secret eksik' >&2; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'SUPABASE_ANON_KEY secret eksik' >&2; exit 1; }
          flutter build ipa --release -t lib/main_production.dart \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define=APP_ENV=production
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwanSport-iOS-${{ github.sha }}
          path: apps/swansport_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload to TestFlight
        if: github.ref_type == 'tag'
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: apps/swansport_app/build/ios/ipa/*.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'
