name: Build iOS IPA (Sideloadly)

on:
  workflow_dispatch: # GitHub arayüzünden tek tıkla manuel çalıştırma
  push:
    branches:
      - main
    paths:
      - 'apps/swansport_app/**'
      - 'packages/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: actions/setup-flutter@v3
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: apps/swansport_app
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloadly
        working-directory: apps/swansport_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r swansport.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swansport-ios-ipa
          path: apps/swansport_app/build/ios/iphoneos/swansport.ipa
          retention-days: 14
