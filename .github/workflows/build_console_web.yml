name: Build Console Web

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: console-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build-console:
    needs: verify
    name: Build Desktop Console Web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Build Console Web
        working-directory: apps/swansport_console
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gokkimnokigqxmbppvle.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_G5WQXM4DMmpnwPN9V9srFQ_JZZ2_Yje' }}
        run: |
          flutter build web --release -t lib/main_production.dart \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define=APP_ENV=production

      - name: Package Web Zip
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          echo "${{ github.sha }}" > apps/swansport_console/build/web/version_sha.txt
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${SHORT_SHA}|g" apps/swansport_console/build/web/index.html
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=${SHORT_SHA}\"|g" apps/swansport_console/build/web/flutter_bootstrap.js
          python3 -c '
          import re, pathlib
          p = pathlib.Path("apps/swansport_console/build/web/flutter_bootstrap.js")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"_flutter\.loader\.load\(\{[\s\S]*?\}\);", "_flutter.loader.load();", s)
          p.write_text(s, encoding="utf-8")
          '
          cd apps/swansport_console/build/web
          zip -qry "$GITHUB_WORKSPACE/swansport-console-web.zip" .

      - name: Upload Console Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swansport-console-web
          path: apps/swansport_console/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Attach Console Web to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.5.2+20' }}
          files: swansport-console-web.zip
          fail_on_unmatched_files: true
