name: Phase 3 Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply migrations after the mandatory dry-run'
        type: boolean
        default: false
      provision_test_accounts:
        description: 'Provision guarded staging-only role test accounts'
        type: boolean
        default: false
      build_android:
        description: 'Build a signed Android staging APK'
        type: boolean
        default: true
      build_ios_preview:
        description: 'Build an unsigned iOS staging preview (push disabled)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: phase3-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database:
    name: Validate staging and inspect migrations
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing or production target
        run: python tools/staging_target.py
      - name: Require deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN secret eksik' >&2; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'STAGING_DB_PASSWORD secret eksik' >&2; exit 1; }
      - name: Link the dedicated staging project
        run: npx --yes supabase@2.121.0 link --project-ref "$STAGING_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Mandatory migration dry-run
        run: npx --yes supabase@2.121.0 db push --dry-run --include-all
      - name: Apply migrations to staging
        if: inputs.apply_migrations == true
        run: npx --yes supabase@2.121.0 db push --include-all
      - name: Provision guarded staging test accounts
        if: inputs.provision_test_accounts == true
        env:
          CONFIRMED_SEED: ${{ runner.temp }}/full_roles_test_seed.confirmed.sql
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path('supabase/seed/full_roles_test_seed.sql').read_text(
              encoding='utf-8',
          )
          guard = "v_confirmation text := 'CHANGE_ME';"
          confirmed = (
              "v_confirmation text := "
              "'CANLI_TEST_HESAPLARINI_ONAYLIYORUM';"
          )
          if source.count(guard) != 1:
              raise SystemExit('Test account seed confirmation guard changed')
          if 'v_enable_platform_admin boolean := false;' not in source:
              raise SystemExit('Platform admin seed default is not fail-closed')
          if 'v_enable_federation_roles boolean := false;' not in source:
              raise SystemExit('Federation seed default is not fail-closed')
          Path(os.environ['CONFIRMED_SEED']).write_text(
              source.replace(guard, confirmed),
              encoding='utf-8',
          )
          PY
          npx --yes supabase@2.121.0 db query --linked --file "$CONFIRMED_SEED"

  android:
    name: Build Android staging APK
    if: inputs.build_android == true
    needs: database
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Reject missing or production target
        run: python tools/staging_target.py
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Restore Android signing and staging Firebase
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIREBASE_BASE64: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS FIREBASE_BASE64; do
            test -n "${!name}" || { echo "Eksik staging/build secret: $name" >&2; exit 1; }
          done
          KEYSTORE_PATH="$RUNNER_TEMP/swansport-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s' "$FIREBASE_BASE64" | base64 --decode > apps/swansport_app/android/app/google-services.json
          python tools/validate_android_staging_firebase.py apps/swansport_app/android/app/google-services.json
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PATH" \
            > apps/swansport_app/android/key.properties
      - name: Build signed staging APK
        working-directory: apps/swansport_app
        run: |
          flutter build apk --release -t lib/main_production.dart \
            --dart-define="SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$STAGING_SUPABASE_ANON_KEY" \
            --dart-define=APP_ENV=production
          mkdir -p build/staging
          cp build/app/outputs/flutter-apk/app-release.apk build/staging/SwanSport-staging.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwanSport-Android-staging
          path: apps/swansport_app/build/staging/SwanSport-staging.apk
          if-no-files-found: error
          retention-days: 14

  ios-preview:
    name: Build iOS staging preview
    if: inputs.build_ios_preview == true
    needs: database
    runs-on: macos-latest
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      IOS_FIREBASE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Reject missing or production target
        run: python tools/staging_target.py
      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Configure unsigned build
        run: |
          python tools/configure_ios_firebase.py
          printf '%s\n' 'DEVELOPMENT_TEAM = 0000000000' 'CODE_SIGN_IDENTITY =' \
            'CODE_SIGNING_REQUIRED = NO' 'CODE_SIGNING_ALLOWED = NO' \
            'CODE_SIGN_ENTITLEMENTS =' > apps/swansport_app/ios/Flutter/Signing.xcconfig
      - name: Build unsigned staging preview
        working-directory: apps/swansport_app
        run: |
          flutter build ios --release --no-codesign -t lib/main_production.dart \
            --dart-define="SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$STAGING_SUPABASE_ANON_KEY" \
            --dart-define=IOS_FIREBASE_ENABLED=false \
            --dart-define=APP_ENV=production
          mkdir -p build/ios/staging/Payload build/ios/release
          cp -R build/ios/iphoneos/Runner.app build/ios/staging/Payload/
          rm -f build/ios/staging/Payload/Runner.app/GoogleService-Info.plist
          find build/ios/staging/Payload/Runner.app -name '*.xcent' -delete
          python ../../tools/verify_ios_preview_bundle.py build/ios/staging/Payload/Runner.app --firebase-enabled false
          cd build/ios/staging
          zip -qry ../release/SwanSport-staging-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SwanSport-iOS-staging-unsigned
          path: apps/swansport_app/build/ios/release/SwanSport-staging-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
