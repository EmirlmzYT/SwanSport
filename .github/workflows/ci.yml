name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format:check
        continue-on-error: true

      - name: Analyze
        run: melos analyze --no-fatal-infos

      - name: Test
        run: |
          flutter test --no-pub packages/swansport_core
          flutter test --no-pub packages/swansport_models
          flutter test --no-pub packages/swansport_design_system
          flutter test --no-pub packages/swansport_branch_engine
          flutter test --no-pub packages/swansport_data
          flutter test --no-pub apps/swansport_app/test/federation_center_test.dart
          flutter test --no-pub apps/swansport_app/test/modern_messages_screen_test.dart
          flutter test --no-pub apps/swansport_app/test/merged_routes_test.dart
