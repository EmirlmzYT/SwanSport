name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      acceptance_only:
        description: 'Run only disposable real-backend acceptance; produces no release package'
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable local Supabase and real Auth fixtures
        run: node tools/start_local_test_center.mjs --backend-only
      - name: Real role, RLS and multi-session acceptance
        run: node tools/run_phase2_acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-acceptance-${{ github.run_id }}
          path: build/phase2-acceptance.json
          if-no-files-found: warn
      - name: Stop disposable backend
        if: always()
        run: npx --yes supabase@2.121.0 stop --workdir tools/local-test-center
  validate:
    if: inputs.acceptance_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - packages/swansport_core
          - packages/swansport_models
          - packages/swansport_design_system
          - packages/swansport_branch_engine
          - packages/swansport_data
          - apps/swansport_app
          - apps/swansport_console

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Bootstrap
        run: flutter pub get --enforce-lockfile

      - name: Format check
        run: dart format --output=none --set-exit-if-changed ${{ matrix.target }}/lib ${{ matrix.target }}/test
        # Existing format debt is visible but does not mask test/analyzer failures.
        continue-on-error: true

      - name: Analyze
        working-directory: ${{ matrix.target }}
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        working-directory: ${{ matrix.target }}
        run: flutter test --no-pub

  backend-contracts:
    if: inputs.acceptance_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-test.txt
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r tools/requirements-test.txt
      - name: SQL and JavaScript behavior tests (isolated PostgreSQL)
        run: npm test --prefix tools
      - name: Release contracts
        run: |
          python tools/check_migrations.py
          python tools/check_faq.py
          python tools/check_push_routes.py
          python tools/check_mobile_ui_tokens.py
          python tools/mobile_release_acceptance.py
          python tools/ios_push_config_test.py
          python -m unittest discover -s tools -p '*_test.py'
          python tools/release_matrix.py --output build/release-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-release-matrix
          path: build/release-matrix.json
          if-no-files-found: error

  web-build:
    if: inputs.acceptance_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        application: [swansport_app, swansport_console]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile production entrypoint (no deployment)
        working-directory: apps/${{ matrix.application }}
        run: flutter build web --release --no-pub -t lib/main_production.dart --dart-define=APP_ENV=production --no-wasm-dry-run
